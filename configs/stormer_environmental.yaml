name: stormer
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  
  # 此处指定 2.1.2 是为了配合集群上可用的 xformers 0.0.23
  - pytorch==2.1.2
  - torchvision==0.16.2
  - torchaudio==2.1.2
  - pytorch-cuda=11.8
  
 
  - numpy<2.0
  - xarray
  - dask
  - netcdf4
  - h5py
  - pandas

  - eccodes
  - cfgrib

  - pip
  - pip:
    - lightning>=2.0.0  
    - timm              
    - einops            
    - wandb             
    - huggingface_hub   
    - scipy
    - pyyaml
    
    - xformers==0.0.23